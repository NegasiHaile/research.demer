<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DEMER research">
  <defs>
    <!-- Same deep ocean blue as the DEMER shop mark -->
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A6CB0"/>
      <stop offset="0.45" stop-color="#0E3F7A"/>
      <stop offset="1" stop-color="#061F45"/>
    </linearGradient>
  </defs>
  <!-- Magnifier handle -->
  <path d="M41 41 55 55" fill="none" stroke="#0E3F7A" stroke-width="8" stroke-linecap="round"/>
  <!-- Lens ring -->
  <circle cx="27" cy="27" r="20" fill="url(#ocean)" stroke="#3A7BC0" stroke-width="1"/>
  <!-- Lens glass -->
  <circle cx="27" cy="27" r="14" fill="#FFFFFF"/>
  <!-- Heartbeat inside the lens -->
  <path d="M15 28h5.5l2.5-5.5 4 11 2.5-5.5H39" fill="none" stroke="#0B4A8F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
